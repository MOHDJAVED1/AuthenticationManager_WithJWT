spring.application.name=authentication

#database_config
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Enable SQL statement printing
spring.jpa.show-sql=true

# Fromate_hibernate_query
spring.jpa.properties.hibernate.format_sql=true

# Detect entity
spring.jpa.hibernate.ddl-auto=update

# Debug security issues
logging.level.org.springframework.security=DEBUG

#Jwt access key
app.jwt.secret=${JWT_SECRET_KEY}
app.jwt.expiration-ms=900000

app.bootstrap.super-admin.email = ${SUPER_ADMIN_USERNAME}
app.bootstrap.super-admin.password = ${SUPER_ADMIN_PASSWORD}


# smtp
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth = true
spring.mail.properties.mail.smtp.starttls.enable = true

spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

orgnization.name = ABC Company
orgnization.address = ABC Company
orgnization.email = abc@gmail.com
orgnization.phoneNumber = 1111111111

# Account Lockout Configuration
security.login.max-failed-attempts = 3
security.login.lock-duration-minutes = 60

# Rate limit
# General API rate limi
security.rate-limit.general.capacity = 3
security.rate-limit.general.refill-minutes = 1

# Login rate limi
security.rate-limit.login.capcity = 10
security.rate-limit.login.refill-minutes = 1


# condidional bean
app.bootstrap-super-admin-enabled = false

# Code need to be run on powershell to get that key
# powershell -Command "$b=New-Object byte[] 32;$r=[Security.Cryptography.RandomNumberGenerator]::Create();$r.GetBytes($b);[Convert]::ToBase64String($b);$r.Dispose()"